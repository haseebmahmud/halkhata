name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
      - run: npm ci
      - run: npm run bundle:r
      - run: npx electron-builder --mac dir
      - run: bash electron/build-macos-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Halkhata-macOS
          path: dist/Halkhata-macos-*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
      - run: npm ci
      - run: npm run bundle:r
      - run: npx electron-builder --win nsis --x64
      - uses: actions/upload-artifact@v4
        with:
          name: Halkhata-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
